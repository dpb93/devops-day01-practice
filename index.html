
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 40px;
            background: #eef2f5;
        }

        .notice {
            background: #2b2b2b;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #0066cc;
        }
    </style>
</head>
<body>
    <div class="notice">
        <strong>NOTICE:</strong>
        Migration Complete |
        Database Maintenance Scheduled for 10:00 PM Tonight
    </div>

    <main class="card">
        <h1>DevOps Production Portal (Unified)</h1>
        <p>Environment: Production</p>
        <p>Deployment Status: Migration Complete</p>
    </main>
</body>
</html
